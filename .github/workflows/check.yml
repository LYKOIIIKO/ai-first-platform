name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global --no-audit --no-fund pnpm@12.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
